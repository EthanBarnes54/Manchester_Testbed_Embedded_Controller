; Shared by every environment below, so the pinned versions cannot drift apart.
;
; Everything is pinned exactly. main.cpp uses ledcSetup / ledcAttachPin / timerAlarmWrite,
; which only exist in the Arduino-ESP32 2.0.x core that espressif32 6.12.0 ships
; (framework-arduinoespressif32 3.20017). Change these only alongside a rebuild and a bench test.
[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
  adafruit/Adafruit ADS1X15@2.6.2
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit MCP4725@2.0.2
  bblanchon/ArduinoJson@6.21.5

[env:esp32dev]
; Enabling Over The Air updates (ESPOTA)
; upload_protocol = espota
; upload_port = XXX.XXX.X.X.X      ; IP of ESP CHANGE FOR OUR DEVICE
; upload_flags = --auth=YourOtaPassword

; Site credentials go here rather than in main.cpp so they are never committed.
; OTA stays disabled until TESTBED_OTA_PASSWORD is set.
; build_flags = -DTESTBED_WIFI_SSID='"YourNetwork"' -DTESTBED_WIFI_PASSWORD='"YourKey"' -DTESTBED_OTA_PASSWORD='"YourOtaPassword"'

upload_protocol = esptool
upload_port = COM4

; board_build.partitions = custom_partitions.csv

build_flags = -DLOG_LEVEL=0 -mtext-section-literals

[env:esp32_debug]
build_flags = -DLOG_LEVEL=4 -DDEBUG -O1 -mtext-section-literals
upload_protocol = esptool
upload_port = COM4
