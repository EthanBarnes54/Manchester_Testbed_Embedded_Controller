[pytest]
testpaths = tests
pythonpath = .
# The mutation suite rebuilds the harnesses dozens of times; CI runs it as its own job
# with -m mutation. Passing -m on the command line replaces this filter.
addopts = -ra --strict-markers -m "not mutation"
markers =
    req(*ids): the requirement IDs in docs/requirements.md that this test verifies
    mutation: breaks a safety check on purpose and expects the suite to notice (slow)
    hil: needs the rig connected; set TESTBED_HIL_PORT (see hil/README.md)
    soak: long-running rig test; set TESTBED_SOAK_MINUTES
