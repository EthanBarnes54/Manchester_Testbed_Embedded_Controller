name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Embedded Controller/Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: Embedded Controller/Backend/.python-version
          cache: pip
          cache-dependency-path: Embedded Controller/Backend/requirements*.txt

      # torch first from the CPU index, at the version requirements.txt pins, so the
      # runner does not download the CUDA build it has no use for.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "$(grep -E '^torch==' requirements.txt)"
          pip install -r requirements-dev.txt

      - name: Static checks
        working-directory: Embedded Controller
        run: ruff check .

      # The host harnesses run under AddressSanitizer and UndefinedBehaviorSanitizer here;
      # .coveragerc holds the coverage floor the run must clear.
      - name: Run tests
        run: python -m pytest -v --cov --cov-report=term-missing

      - name: Requirements traceability
        run: |
          python ../tools/traceability.py > traceability.md
          python ../tools/traceability.py --check

      - name: Keep the traceability matrix
        uses: actions/upload-artifact@v4
        with:
          name: traceability-${{ github.sha }}
          path: Embedded Controller/Backend/traceability.md

  mutation:
    name: Mutation tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Embedded Controller/Backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: Embedded Controller/Backend/.python-version
          cache: pip
          cache-dependency-path: Embedded Controller/Backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "$(grep -E '^torch==' requirements.txt)"
          pip install -r requirements-dev.txt

      # Each case breaks one safety check on purpose; the job fails if any goes unnoticed.
      - name: Run mutation tests
        run: python -m pytest -v -m mutation

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Embedded Controller

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('Embedded Controller/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      # platformio.ini builds the project's own sources with every warning as an error.
      - name: Build every environment
        run: pio run -e esp32dev -e esp32_debug -e esp32_deploy

      - name: Image size budget
        run: python tools/check_firmware_size.py esp32dev esp32_debug esp32_deploy

      # After the build, so the Arduino core PlatformIO installed is listed too.
      - name: Software bill of materials
        run: python tools/generate_sbom.py sbom.cdx.json

      - name: Keep the images and the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            Embedded Controller/.pio/build/*/firmware.bin
            Embedded Controller/sbom.cdx.json
